# La CI publique (GitHub). La CI de référence est celle de la forge
# (.gitea/workflows/ci.yml) ; celle-ci rejoue l'essentiel pour qui contribue ici.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Construire le fournisseur et la CLI
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/terraform-provider-recodanse .
          CGO_ENABLED=0 go build -trimpath -o /tmp/recodanse-connexion ./cmd/recodanse-connexion
          /tmp/recodanse-connexion version
