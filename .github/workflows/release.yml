# La release SIGNÉE, sur GitHub (le dépôt y est un miroir de la forge).
#
# Un tag `vX.Y.Z` poussé → goreleaser construit le fournisseur (zip par
# plateforme) et recodanse-connexion, écrit SHA256SUMS, le signe par GPG, publie
# la release. Le registre Terraform la lit par son webhook ; le registre
# d'OpenTofu la relit de lui-même une fois le fournisseur inscrit.
#
# Secrets du dépôt GitHub : GPG_PRIVATE_KEY (clé armurée), PASSPHRASE.
# La clé PUBLIQUE est celle déclarée aux deux registres.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests avant de publier
        run: go test -count=1 ./...

      - name: Importer la clé de signature
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
